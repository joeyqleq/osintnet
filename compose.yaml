name: osintnet
services:
  gateway:
    build: .
    image: osintnet:0.1.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.5
    mem_limit: 768m
    pids_limit: 128
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    ports: ["127.0.0.1:8780:8780"]
    env_file: .env
    volumes: ["osintnet-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  osintnet-data:
